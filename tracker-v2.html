<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Учебный трекер</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #dfe5ee;
      --accent: #3659c9;
      --accent-hover: #2948aa;
      --success: #18794e;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --shadow: 0 8px 28px rgba(24, 34, 48, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .page {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    header { margin-bottom: 24px; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.65rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      min-width: 0;
      padding: 12px;
      border-radius: 12px;
      background: #f7f8fc;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 4px;
    }

    .stat-value {
      display: block;
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .progress-track {
      height: 10px;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf5;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent);
      transition: width .2s ease;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 1.08rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px auto;
      align-items: end;
      gap: 12px;
    }

    .field { min-width: 0; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: .9rem;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid #c8d0dc;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid rgba(54, 89, 201, .25);
      outline-offset: 2px;
    }

    input[aria-invalid="true"] { border-color: var(--danger); }

    .error {
      min-height: 1.25em;
      margin: 4px 0 0;
      color: var(--danger);
      font-size: .8rem;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover { background: var(--accent-hover); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-button {
      min-height: 38px;
      padding: 7px 13px;
      border-color: var(--border);
      background: #fff;
      color: var(--text);
    }

    .filter-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #eef2ff;
      color: #2948aa;
    }

    .task-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
    }

    .task-check {
      width: 20px;
      height: 20px;
      min-height: 20px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .task-title {
      display: block;
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .task.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-hours {
      display: block;
      color: var(--muted);
      font-size: .86rem;
    }

    .delete-button {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 6px 10px;
      border-color: #f0c7c4;
      background: #fff;
      color: var(--danger);
    }

    .delete-button:hover { background: var(--danger-bg); }

    .empty-state {
      padding: 18px 12px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 11px;
    }

    .storage-message {
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid #f0d49a;
      border-radius: 9px;
      background: #fff8e8;
      color: #704b00;
      font-size: .9rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 24px, 760px);
        padding-top: 24px;
      }

      .panel { padding: 16px; }
      .stats { gap: 8px; }
      .stat { padding: 10px 8px; }
      .stat-label { font-size: .75rem; }
      .form-grid { grid-template-columns: minmax(0, 1fr) minmax(105px, 36%); }
      .form-grid .submit-wrap { grid-column: 1 / -1; }
      .form-grid button { width: 100%; }
      .task { gap: 9px; padding: 11px 9px; }
      .delete-button { padding: 6px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Учебный трекер</h1>
      <p class="subtitle">Планируйте учебные задачи и отслеживайте прогресс за неделю.</p>
    </header>

    <p id="storageMessage" class="storage-message" role="status" hidden></p>

    <section class="panel" aria-labelledby="summaryHeading">
      <h2 class="section-title" id="summaryHeading">Мой прогресс</h2>
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Всего часов</span>
          <span class="stat-value" id="totalHours">8 ч</span>
        </div>
        <div class="stat">
          <span class="stat-label">Выполнено</span>
          <span class="stat-value" id="completedHours">2 ч</span>
        </div>
        <div class="stat">
          <span class="stat-label">Прогресс</span>
          <span class="stat-value" id="progressText">25%</span>
        </div>
      </div>
      <div
        class="progress-track"
        id="progressTrack"
        role="progressbar"
        aria-label="Процент выполнения задач"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="25"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="addHeading">
      <h2 class="section-title" id="addHeading">Добавить задачу</h2>
      <form id="taskForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="taskTitle">Название задачи</label>
            <input id="taskTitle" name="title" type="text" placeholder="Например, чтение главы">
            <p class="error" id="titleError" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="taskHours">Часы</label>
            <input id="taskHours" name="hours" type="number" min="0.5" max="24" step="0.5" inputmode="decimal" placeholder="2">
            <p class="error" id="hoursError" aria-live="polite"></p>
          </div>
          <div class="submit-wrap">
            <button class="primary" type="submit">Добавить задачу</button>
          </div>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="tasksHeading">
      <h2 class="section-title" id="tasksHeading">Мои задачи</h2>
      <div class="filters" role="group" aria-label="Фильтр задач">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">Все</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Активные</button>
        <button class="filter-button" type="button" data-filter="done" aria-pressed="false">Готовые</button>
      </div>
      <ul class="task-list" id="taskList" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "study-tracker-v2-tasks";

    const starterTasks = [
      { id: 1, title: "Чтение", hours: 2, done: true },
      { id: 2, title: "Практика", hours: 4, done: false },
      { id: 3, title: "Повторение", hours: 2, done: false }
    ];

    let tasks = starterTasks.map(task => ({ ...task }));
    let currentFilter = "all";
    let storageAvailable = true;

    const taskForm = document.getElementById("taskForm");
    const titleInput = document.getElementById("taskTitle");
    const hoursInput = document.getElementById("taskHours");
    const titleError = document.getElementById("titleError");
    const hoursError = document.getElementById("hoursError");
    const taskList = document.getElementById("taskList");
    const totalHoursElement = document.getElementById("totalHours");
    const completedHoursElement = document.getElementById("completedHours");
    const progressTextElement = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const progressTrack = document.getElementById("progressTrack");
    const storageMessage = document.getElementById("storageMessage");

    function showStorageWarning() {
      storageMessage.textContent =
        "Локальное сохранение недоступно. Изменения будут храниться только до закрытия страницы.";
      storageMessage.hidden = false;
    }

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) return;

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || !parsed.every(isValidStoredTask)) {
          throw new Error("Некорректные сохраненные данные");
        }

        tasks = parsed;
      } catch (error) {
        storageAvailable = false;
        showStorageWarning();
        tasks = starterTasks.map(task => ({ ...task }));
      }
    }

    function isValidStoredTask(task) {
      return task !== null
        && typeof task === "object"
        && (typeof task.id === "string" || typeof task.id === "number")
        && typeof task.title === "string"
        && task.title.trim().length > 0
        && typeof task.hours === "number"
        && Number.isFinite(task.hours)
        && task.hours >= 0.5
        && task.hours <= 24
        && Number.isInteger(task.hours * 2)
        && typeof task.done === "boolean";
    }

    function saveTasks() {
      if (!storageAvailable) return;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        storageAvailable = false;
        showStorageWarning();
      }
    }

    function formatHours(value) {
      return Number.isInteger(value) ? String(value) : String(value).replace(".", ",");
    }

    function getVisibleTasks() {
      if (currentFilter === "active") return tasks.filter(task => !task.done);
      if (currentFilter === "done") return tasks.filter(task => task.done);
      return tasks;
    }

    function renderStats() {
      const totalHours = tasks.reduce((sum, task) => sum + task.hours, 0);
      const completedHours = tasks.reduce(
        (sum, task) => sum + (task.done ? task.hours : 0),
        0
      );
      const progress = totalHours === 0
        ? 0
        : Math.round(100 * completedHours / totalHours);

      totalHoursElement.textContent = formatHours(totalHours) + " ч";
      completedHoursElement.textContent = formatHours(completedHours) + " ч";
      progressTextElement.textContent = progress + "%";
      progressFill.style.width = progress + "%";
      progressTrack.setAttribute("aria-valuenow", String(progress));
    }

    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = getVisibleTasks();

      if (visibleTasks.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-state";
        emptyItem.textContent = tasks.length === 0
          ? "Пока нет задач. Добавьте первую задачу."
          : "В этом фильтре пока нет задач.";
        taskList.append(emptyItem);
        return;
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.id = "task-check-" + String(task.id);
        checkbox.setAttribute(
          "aria-label",
          (task.done ? "Снять отметку выполнения: " : "Отметить выполненной: ") + task.title
        );
        checkbox.addEventListener("change", () => {
          updateTaskStatus(task.id, checkbox.checked);
        });

        const main = document.createElement("div");
        main.className = "task-main";

        const title = document.createElement("label");
        title.className = "task-title";
        title.htmlFor = checkbox.id;
        title.textContent = task.title;

        const hours = document.createElement("span");
        hours.className = "task-hours";
        hours.textContent = formatHours(task.hours) + (task.hours === 1 ? " час" : " ч");

        main.append(title, hours);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Удалить";
        deleteButton.setAttribute("aria-label", "Удалить задачу: " + task.title);
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        item.append(checkbox, main, deleteButton);
        taskList.append(item);
      });
    }

    function render() {
      renderStats();
      renderTasks();
      document.querySelectorAll("[data-filter]").forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.filter === currentFilter)
        );
      });
    }

    function updateTaskStatus(id, done) {
      tasks = tasks.map(task => task.id === id ? { ...task, done } : task);
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      render();
    }

    function validateForm() {
      const title = titleInput.value.trim();
      const rawHours = hoursInput.value;
      const hours = rawHours === "" ? NaN : Number(rawHours);

      const titleMessage = title.length === 0
        ? "Введите название задачи."
        : "";

      let hoursMessage = "";
      if (rawHours.trim() === "") {
        hoursMessage = "Укажите количество часов.";
      } else if (!Number.isFinite(hours)) {
        hoursMessage = "Введите корректное число.";
      } else if (hours < 0.5 || hours > 24) {
        hoursMessage = "Укажите от 0,5 до 24 часов.";
      } else if (!Number.isInteger(hours * 2)) {
        hoursMessage = "Шаг должен составлять 0,5 часа.";
      }

      titleError.textContent = titleMessage;
      hoursError.textContent = hoursMessage;
      titleInput.setAttribute("aria-invalid", String(Boolean(titleMessage)));
      hoursInput.setAttribute("aria-invalid", String(Boolean(hoursMessage)));

      return {
        valid: !titleMessage && !hoursMessage,
        title,
        hours
      };
    }

    function createTaskId() {
      const numericIds = tasks
        .map(task => Number(task.id))
        .filter(Number.isSafeInteger);
      return Math.max(0, ...numericIds) + 1;
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const result = validateForm();

      if (!result.valid) return;

      tasks.push({
        id: createTaskId(),
        title: result.title,
        hours: result.hours,
        done: false
      });

      saveTasks();
      taskForm.reset();
      titleError.textContent = "";
      hoursError.textContent = "";
      titleInput.setAttribute("aria-invalid", "false");
      hoursInput.setAttribute("aria-invalid", "false");
      render();
      titleInput.focus();
    });

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        render();
      });
    });

    loadTasks();
    render();
  </script>
</body>
</html>
